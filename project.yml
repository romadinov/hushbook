name: Hushbook
options:
  bundleIdPrefix: com.romadinov
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: SZVSSCJQFN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
targets:
  HushbookMac:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/macOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - target: HushbookMCP
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Hushbook
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.hushbook.mac
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice notes for your diary entries.
        INFOPLIST_KEY_NSLocationUsageDescription: New entries remember where you wrote them, encrypted with the entry.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: New entries remember where you wrote them, encrypted with the entry.
        INFOPLIST_KEY_CFBundleDisplayName: Hushbook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/Hushbook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/macOS/Hushbook-Release.entitlements
  HushbookMCP:
    type: tool
    platform: macOS
    sources:
      - Sources/MCP
      - Sources/Shared/Crypto.swift
      - Sources/Shared/Model.swift
      - Sources/Shared/LocalStore.swift
      - Sources/Shared/Location.swift
      - Sources/Shared/Inbox.swift
    settings:
      base:
        PRODUCT_NAME: hushbook-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.hushbook.mcp
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  HushbookIOS:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hushbook
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.romadinov.hushbook.quicknote
            UIApplicationShortcutItemTitle: Quick Hashnote
            UIApplicationShortcutItemSubtitle: Without unlocking
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
        NSFaceIDUsageDescription: Face ID unlocks your diary after you have entered its password.
        NSCameraUsageDescription: Take photos for your diary entries.
        NSMicrophoneUsageDescription: Record voice notes for your diary entries.
        NSLocationWhenInUseUsageDescription: New entries remember where you wrote them, encrypted with the entry.
        NSPhotoLibraryUsageDescription: Add photos from your library to diary entries.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_NAME: Hushbook
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.hushbook
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Hushbook.entitlements
schemes:
  HushbookMac:
    build:
      targets:
        HushbookMac: all
    run:
      config: Debug
  HushbookIOS:
    build:
      targets:
        HushbookIOS: all
    run:
      config: Debug
